# Local container run. Put the Neon *dev* branch connection string in .env (see .env.example):
#   GIT_SHA=$(git rev-parse HEAD) docker compose up --build
services:
  web:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: mixology:local
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env (Neon dev branch)}
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
